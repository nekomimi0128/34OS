name: build-v2

on:
  workflow_dispatch:
  push:
    paths:
      - "build-v2-ci.sh"
      - ".github/workflows/build-v2.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build 34OS v2 ISO
        run: bash build-v2-ci.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: 34os-v2-iso
          path: 34os-v2.iso
          if-no-files-found: error
