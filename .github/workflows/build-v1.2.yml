name: build-v1.2

on:
  workflow_dispatch:
  push:
    paths:
      - "build-v1.2-ci.sh"
      - ".github/workflows/build-v1.2.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build 34OS v1.2 ISO
        run: bash build-v1.2-ci.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: 34os-v1.2-iso
          path: 34os-v1.2.iso
          if-no-files-found: error
