<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>34OS — It's very hyper ultra super mega light-weight OS</title>
<meta name="description" content="34OS v2.2 — TopNumber">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚂</text></svg>">
<meta property="og:type" content="website">
<meta property="og:site_name" content="34OS">
<meta property="og:title" content="34OS v2.2 — TopNumber">
<meta property="og:description" content="1号機として、ふさわしい——を。">
<meta name="twitter:card" content="summary">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #070a12;
    color: #eef2f7;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: -1; }
  .teaser { text-align: center; padding: 1rem; }
  .teaser-line {
    font-size: clamp(1.7rem, 5.2vw, 2.7rem);
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1.5;
    margin: 0;
    white-space: nowrap;
  }
  .reel {
    display: inline-block;
    width: 3.4em;
    height: 1.5em;
    overflow: hidden;
    vertical-align: -0.32em;
    border-bottom: 2px solid #e6c87a;
  }
  .reel canvas { display: block; width: 100%; height: 100%; }
  .teaser-sub {
    color: #93a3b5;
    letter-spacing: .4em;
    font-size: .85rem;
    margin: 1.6rem 0 0;
  }
  @media (max-width: 560px) {
    .teaser-line { white-space: normal; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="teaser">
  <p class="teaser-line">1号機として、ふさわしい<span class="reel"><canvas id="reelCanvas" width="204" height="90"></canvas></span>を。</p>
  <p class="teaser-sub">34OS v2.2 — TopNumber</p>
</div>

<script>
  // starfield (same as nekomimi0128.com)
  (function () {
    var c = document.getElementById('stars'), x = c.getContext('2d'), stars = [], W, H;
    function resize() {
      W = c.width = innerWidth; H = c.height = innerHeight;
      stars = [];
      for (var i = 0; i < 130; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .2, p: Math.random() * Math.PI * 2 });
    }
    function tick(t) {
      x.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i], a = .35 + .65 * Math.abs(Math.sin(t / 1400 + s.p));
        x.globalAlpha = a; x.fillStyle = '#cfe8ff';
        x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2); x.fill();
      }
      x.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(tick);
  })();

  // teaser reel: the slot shows no letterforms at all, only fast
  // vertical streaks (the dev team's words spin behind them, unreadable)
  (function () {
    var cv = document.getElementById('reelCanvas');
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var streaks = [];
    for (var i = 0; i < 34; i++) {
      streaks.push({
        x: Math.random() * W,
        y: Math.random() * H,
        len: 14 + Math.random() * 42,
        speed: 5 + Math.random() * 9,
        w: Math.random() < 0.22 ? 2.4 : 1.2,
        gold: Math.random() < 0.72,
        a: 0.25 + Math.random() * 0.55
      });
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < streaks.length; i++) {
        var s = streaks[i];
        s.y += s.speed;
        if (s.y - s.len > H) { s.y = -4; s.x = Math.random() * W; }
        ctx.strokeStyle = s.gold ? 'rgba(230,200,122,' + s.a + ')' : 'rgba(235,238,245,' + (s.a * 0.8) + ')';
        ctx.lineWidth = s.w;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - s.len);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    frame();
  })();
</script>
</body>
</html>
