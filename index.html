    var cv = document.getElementById('reelCanvas');
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var streaks = [];
    for (var i = 0; i < 34; i++) {
      streaks.push({
        x: Math.random() * W,
        y: Math.random() * H,
        len: 14 + Math.random() * 42,
        speed: 5 + Math.random() * 9,
        w: Math.random() < 0.22 ? 2.4 : 1.2,
        gold: Math.random() < 0.72,
        a: 0.25 + Math.random() * 0.55
      });
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < streaks.length; i++) {
        var s = streaks[i];
        s.y += s.speed;
        if (s.y - s.len > H) { s.y = -4; s.x = Math.random() * W; }
        ctx.strokeStyle = s.gold ? 'rgba(230,200,122,' + s.a + ')' : 'rgba(235,238,245,' + (s.a * 0.8) + ')';
        ctx.lineWidth = s.w;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - s.len);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    frame();
  })();
  // release countdown: v2.2 "TopNumber", 2026-12-25 20:34 JST
  (function () {
    var el = document.getElementById('countdown');
    if (!el) return;
    var target = new Date('2026-12-25T20:34:00+09:00').getTime();
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) { el.textContent = 'リリースされました'; return; }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor(diff % 86400000 / 3600000);
      var m = Math.floor(diff % 3600000 / 60000);
      var s = Math.floor(diff % 60000 / 1000);
      el.textContent = 'あと' + d + '日 ' + pad(h) + ':' + pad(m) + ':' + pad(s);
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
